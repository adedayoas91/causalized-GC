[project]
name = "causalized-gc"
version = "0.1.0"
description = "CPU and NVIDIA GPU runtime backends for c-GC and c-GC*."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mat73",
    "matplotlib",
    "numba==0.61.2",
    "numpy==2.2.0",
    "pandas",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "tqdm",
]

[project.optional-dependencies]
metrics = [
    "cdt>=0.6.0",
]
gpu-cu12 = [
    "cupy-cuda12x>=13.0; sys_platform == 'linux'",
    "cuml-cu12>=24.0; sys_platform == 'linux'",
]
gpu-cu13 = [
    "cupy-cuda13x>=13.0; sys_platform == 'linux'",
    "cuml-cu13>=24.0; sys_platform == 'linux'",
]
notebook = [
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
    "notebook>=7.0",
]

[dependency-groups]
dev = [
    "pylint",
    "pytest",
]

[tool.uv]
package = true
conflicts = [
    [
        { extra = "gpu-cu12" },
        { extra = "gpu-cu13" },
    ],
]

[tool.uv.sources]
cuml-cu12 = { index = "nvidia" }
cuml-cu13 = { index = "nvidia" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["README.md", "benchmarks", "pyproject.toml", "src", "test"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
only-include = ["src/causalized_gc", "src/d_CSL.py"]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["test"]
markers = ["gpu: requires a compatible NVIDIA GPU and CUDA runtime"]
